        path: /publisher/uploadfile
      - step: Browse for a file under "Select a file" and select the test resource file "title_with_html_tags.xml" from
              the Crossref 5.3.1 resources
        resource: /xml_upload_test_package/Crossref/5.3.1/title_with_html_tags.xml
      - step: Choose "Crossref 5.3.1 XML" from "Format of the file" dropdown
      - step: Click "Upload"
        results:
          - A flash message appears at the top of the screen indicating that the file reference was successfully received
          - Your file is shown in the "History of uploads" with status "pending"
      - step: wait a short amount of time for the job to process, then reload the page (do not re-submit the form data).
          If the job remains in "pending", reload the page until the status changes.
        results:
          - Your file is shown in the "History of uploads" with status "successfully processed", and the Note 
            "1 articles imported (1 new, 0 updated)"
      - step: Go to the Table of Contents for the journal (e.g. by going to /toc/2222-2222), and go to the Articles tab
        path: /toc/2222-2222
        results:
          - The list of articles should contain an article with the title "Title with HTML tags escaped and unescaped",
            where both "escaped" and "unescaped" are shown in italics, and no literal "<i>" or "</i>" text is visible

  - title: Successfully upload a file containing rich text (JATS) formatting in the title and abstract
    context:
      role: publisher
      testdrive: publisher_with_journal
    setup:
      - Use the publisher_with_journal testdrive to setup for this test at /testdrive/publisher_with_journal.
        Keep the testdrive tab open and do the test in a separate tab, as leaving the testdrive page tears it down
      - The testdrive creates a journal with ISSNs "1111-1111" and "2222-2222", so make sure no other journal
        on the system has these ISSNs, otherwise the upload will fail
      - You will also need an administrator account for the final step
      - At the end of the test please use the 'teardown' link provided by the testdrive to remove test assets
        (including the uploaded article) from the system
    steps:
      - step: Log in as the publisher account specified by the testdrive result
      - step: Go to the "Upload Article XML" tab in the "Publisher Area"
        path: /publisher/uploadfile
      - step: Browse for a file under "Select a file" and select the test resource file "jats_rich_text.xml" from
          the Crossref 5.3.1 resources
        resource: /xml_upload_test_package/Crossref/5.3.1/jats_rich_text.xml
      - step: Choose "Crossref 5.3.1 XML" from "Format of the file" dropdown
      - step: Click "Upload"
        results:
          - A flash message appears at the top of the screen indicating a successful upload
          - Your file is shown in the "History of uploads" with status "pending"
      - step: wait a short amount of time for the job to process, then reload the page (do not re-submit the form data).
          If the job remains in "pending", reload the page until the status changes.
        results:
          - Your file is shown in the "History of uploads" with status "successfully processed", and the Note
            "1 articles imported (1 new, 0 updated)"
      - step: Go to the Table of Contents for the journal (e.g. by going to /toc/2222-2222), and go to the Articles tab
        path: /toc/2222-2222
        results:
          - The list of articles contains an article titled "Rich text TiOx/Pt3Ti(111) and E=mc2", where the "x" is
            an italic subscript, the "3" is a subscript and the "2" is a superscript
          - No literal tags such as "<sub>", "<i>" or "&lt;sub&gt;" are visible in the title
      - step: Click "Abstract" on that article to expand it
        results:
          - The abstract reads "Films grown on a Pt3Ti(111) surface. Phases z-TiOx and w-TiOx were produced. Energy
            scales as c2. Second paragraph with <script>alert('xss')</script> text."
          - The "3" in "Pt3Ti" is a subscript, each "x" in "TiOx" is an italic subscript, the word "produced" is bold,
            and the "2" in "c2" is a superscript
          - No text from the abstract is missing (in particular "Ti(111) surface", which follows the first subscript,
            is present)
          - The text "<script>alert('xss')</script>" is shown literally as plain text; no alert pop-up appears
      - step: Click the article title to open the public article page
        results:
          - The page heading shows the title with the same subscript/superscript/italic formatting as on the Table of
            Contents, with no literal tags visible
          - The abstract shows the same formatting as on the Table of Contents, and the
            "<script>alert('xss')</script>" text is shown literally with no alert pop-up
          - The browser tab title shows the article title as plain text ("Rich text TiOx/Pt3Ti(111) and E=mc2 ...")
            with no "<sub>", "<i>" or "<sup>" tags in it
      - step: View the page source of the article page and find the "citation_title" meta tag
        results:
          - The content of the "citation_title" meta tag is "Rich text TiOx/Pt3Ti(111) and E=mc2" with no HTML tags
            in it
      - step: Go to the public article search and search for "Rich text TiOx"
        path: /search/articles
        results:
          - The article is found and its title and (expanded) abstract are rendered with the same formatting as on the
            Table of Contents, with no literal tags visible
      - step: Log in as an administrator, go to the "Journals & Articles" search in the admin area and search for
          "Rich text TiOx"
        path: /admin/admin_site_search
        results:
          - The article's title is shown with the same formatting, with no literal tags visible
          - Click "(show/hide)" next to the Abstract; the abstract is shown with the same formatting, and
            "<script>alert('xss')</script>" is shown literally with no alert pop-up

