# ~~ ArticlesPreservation:FunctionalTest -> Preservation:Feature ~~
suite: Articles Preservation
testset: Upload Preservation Files
tests:
- title: Publisher without preservation role
  context:
    role: publisher
    testdrive: article_preservation
  setup:
  - Use the article_preservation testdrive to set up for this test at
    /testdrive/article_preservation
  - This provides a 'no_preservation' account (plain publisher, no preservation
    role) and a 'with_preservation' account (used by the other tests in this suite)
  - At the end of the test suite, use the 'teardown' link provided by the testdrive
    to remove the test assets from the system
  steps:
  - step: Log in as the 'no_preservation' account supplied by the testdrive
  - step: Go to publisher area /publisher
    results:
    - Cannot see 'Preservation' tab
- title: Publisher with preservation role
  context:
    role: publisher
    testdrive: article_preservation
  setup:
  - If you have not already, use the article_preservation testdrive to set up for
    this test at /testdrive/article_preservation
  steps:
  - step: Log in as the 'with_preservation' account supplied by the testdrive
  - step: Go to publisher area /publisher
    results:
    - "'Preservation' tab is visible"
- title: Upload correctly  structured file and it is processed correctly
  context:
    role: publisher
    testdrive: article_preservation
  setup:
  - If you have not already, use the article_preservation testdrive to set up for
    this test at /testdrive/article_preservation
  - The static resource file below can be uploaded exactly as it is in the repo -
    no editing needed. Its identifiers.csv already points at an article owned by
    the 'with_preservation' account
  steps:
  - step: Log in as the 'with_preservation' account supplied by the testdrive, if not
      already logged in
  - step: Go to preservation area /publisher/preservation
  - step: Select 'Browse' and select the package zip file
    resource: /preservation_upload_test_package/valid_article.zip
  - step: click 'Upload'
    results:
    - 'A flash message appears at the top of the screen: File uploaded and waiting
      to be processed.'
    - Upload status is shown in 'History of uploads' with status processing
  - step: wait a short amount of time for the job to process, then reload the page
      (do not re-submit the form data).  If the job remains in "pending", reload the
      page until the status changes.
    results:
    - Upload status in 'History of uploads' changes to 'successfully processed' and
      the 'Notes' shows as 'uploaded to archive server'
- title: Upload incorrectly  structured file
  context:
    role: publisher
    testdrive: article_preservation
  setup:
  - If you have not already, use the article_preservation testdrive to set up for
    this test at /testdrive/article_preservation
  - This test doesn't need any specific article/journal data - the static resource
    file below is already structurally invalid
  steps:
  - step: Log in as the 'with_preservation' account supplied by the testdrive, if not
      already logged in
  - step: Go to preservation area /publisher/preservation
  - step: Select 'Browse' and select the package zip file
    resource: /preservation_upload_test_package/invalid_article.zip
  - step: click 'Upload'
    results:
    - 'A flash message appears at the top of the screen: File uploaded and waiting
      to be processed.'
    - Upload status is shown in 'History of uploads' with status pending
  - step: wait a short amount of time for the job to process, then reload the page
      (do not re-submit the form data).  If the job remains in "pending", reload the
      page until the status changes.
    results:
    - upload status in 'History of uploads' to 'processing failed' and the 'Notes'
      displays 'No articles found in the package. Invalid package uploaded'
- title: Upload correctly  structured file with articles that user do not own
  context:
    role: publisher
    testdrive: article_preservation_unowned
  setup:
  - Use the article_preservation_unowned testdrive to set up for this test at
    /testdrive/article_preservation_unowned
  - This provides a 'tester' account (has the preservation role, but does NOT own
    the article the resource file below points at)
  - This is a separate testdrive from article_preservation, since that one's article
    at the same fixed URL is owned by its own publisher - don't run both at once.
    At the end of the test, use the 'teardown' link provided by the testdrive to
    remove the test assets from the system
  steps:
  - step: Log in as the 'tester' account supplied by the testdrive. Make sure not to
      log in as an admin user, as admin does not have this restriction.
  - step: Go to preservation area /publisher/preservation
  - step: Select 'Browse' and select the package zip file
    resource: /preservation_upload_test_package/valid_article.zip
  - step: click 'Upload'
    results:
    - 'A flash message appears at the top of the screen: File uploaded and waiting
      to be processed.'
    - Upload status is shown in 'History of uploads' with status pending
  - step: wait a short amount of time for the job to process, then reload the page
      (do not re-submit the form data).  If the job remains in "pending", reload the
      page until the status changes.
    results:
    - upload status in 'History of uploads' to 'processing failed' if all the articles
      are not owned by the user. If some of the articles are not owned and remaining
      artcles are owned by the user, the status shows as 'partially succes' if other
      articles are processed successfully.
    - if the status is 'partially success', show details link will be displayed. When
      clicked on the link details of how many articles successful and how many not
      successful will be displayed
- title: Upload correctly structured file with multiple journals and it is processed correctly
  context:
    role: publisher
    testdrive: article_preservation
  setup:
  - If you have not already, use the article_preservation testdrive to set up for
    this test at /testdrive/article_preservation
  - This provides 3 journals owned by 'with_preservation', each with one article
    whose DOI matches an entry in the resource file's identifiers.csv exactly - the
    file below can be uploaded as it is in the repo, with no need to unzip, edit
    identifiers.csv, or re-zip it
  steps:
  - step: Log in as the 'with_preservation' account supplied by the testdrive, if not
      already logged in
  - step: Go to preservation area /publisher/preservation
  - step: Select 'Browse' and select the package zip file
    resource: /preservation_upload_test_package/multi_journals.zip
  - step: click 'Upload'
    results:
    - 'A flash message appears at the top of the screen: File uploaded and waiting
      to be processed.'
    - Upload status is shown in 'History of uploads' with status processing
  - step: wait a short amount of time for the job to process, then reload the page
      (do not re-submit the form data).  If the job remains in "pending", reload the
      page until the status changes.
    results:
    - Upload status in 'History of uploads' changes to 'successfully processed' and
      the 'Notes' shows as 'uploaded to archive server'
    - The 'Notes' has the label 'UPLOADED PACKAGES'
    - Under the label 'UPLOADED PACKAGES', details of the packages that were uploaded are displayed in the format <journal_id>_<Date>.tar.gz
- title: Test maintenance mode for 'Upload preservation file' tab
  context:
    role: publisher
  steps:
  - step: Set the value of 'PRESERVATION_PAGE_UNDER_MAINTENANCE' to True in the configuration file (app.cfg/dev.cfg/test.cfg)
  - step: Go to preservation area /publisher/preservation
    results:
    - Maintenance page should be displayed with the content as 'This page is currently offline for maintenance'
