<div class="form__question">
    <label for="{{ f.name }}">
        {% autoescape off %}{{ f.label }}{% endautoescape%}
        {% if f.optional %}<span class="form__question--optional">({{ _("Optional") }})</span>{% endif %}
    </label>

    <div class="textarea-with-counter-wrapper">
    <textarea
            id="{{ f.name }}"
            name="additional_comments"
            rows="1"
            maxlength="300"
            class="textarea-with-counter"
    ></textarea>

        <span
                id="{{ f.name }}-counter"
                class="character-counter"
                aria-hidden="true"
        >
      0/300
    </span>
    </div>
</div>
