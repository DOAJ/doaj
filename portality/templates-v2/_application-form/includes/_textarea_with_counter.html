<div class="{{ f.name }}__container form__question">
        {% if f.label %}
            <label for="{{f.name}}">
                {% autoescape off %}{{ f.label }}{% endautoescape%}
                {% if f.optional %}<span class="form__question--optional">({{ _("Optional") }})</span>{% endif %}
            </label>
        {% endif %}
        {% if f.help("short_help") %}
            <p class="form__short-help"><small>{{ f.help("short_help") | safe }}</small></p>
        {% endif %}
        {% if "textarea_with_counter" in f.widgets %}
            <div class="textarea-with-counter-wrapper">
                {{ f.render_form_control() }}
                <span
                        id="{{ f.name }}-{{ f.name }}-counter"
                        class="character-counter"
                        aria-hidden="true"
                >
              0/{%- if f.maxlength -%}{{ f.maxlength }}{%- endif -%}
            </span>
            </div>
        {% else %}
            {{ f.render_form_control() }}
        {% endif %}
</div>
