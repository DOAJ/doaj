<div>
    {% if element_list.repeatable_label %}
    <strong>{{ element_list.repeatable_label }}</strong>
    {% endif %}
    <ul>
    {% for element in element_list.elements %}
        {% autoescape off %}
            {{ element.renderer.draw(element, application=application, wfc=wfc) }}
        {% endautoescape %}
    {% endfor %}
    </ul>
</div>
