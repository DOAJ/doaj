triage:
  fields:
    ethics_not_excluded:
      label: "2. Current exclusions"
      check: "2. This application is from a journal or publisher that is <strong>not</strong> 
                  currently excluded."
      answers:
        compliant: '<span class="answer">Compliant</span>, this application is from a journal or publisher that <strong>is not</strong> currently excluded.'
        non_compliant: "<span class='answer'>Non-compliant</span>, this application is from a journal or publisher that <strong>is</strong> currently excluded."
        later: "I don't know - mark for later"
      action: # not used here, should be removed
        button: "non_compliant"
        instruction: "Provide more information on non-standard metric services this journal references"
      remember: 'If the exclusion does not relate to all journals from a publisher, an application for another journal from that publisher should not be rejected at this stage.'
      instructions: '<ul><li>If there is a current publisher exclusion, the answer is <span class="answer compliant">Compliant</span></li>
            <li> if there is a current journal exclusion for the journal we triage, the answer is <span class="answer compliant">Compliant</span></li>
            <li>if there is a current journal exclusion for a different journal than the one we triage from the same publisher, the answer is <span class="answer non-compliant">Non-compliant</span></li></ul>'
      resources:
        - label: "Excluded publishers spreadsheet"
          url: "https://docs.google.com/spreadsheets/d/17Ai-JMAabCrVIR3uhhtFXQZKLAwrK7jKd9DBnU7-GH8/edit?usp=sharing"
      compliant_answers:
      - "compliant"
      non_compliant_answers:
      - "non_compliant"
      recommend:
        non_compliant: "reject"
      edit:
        publisher: "Publisher"
        title: "Journal's title"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Provide more information on non-standard metric services this journal references"

    ethics_no_nonstandard_metrics:
      label: "3. Non-standard metric services"
      check: "3. The journal <strong>does not</strong> display any references  (images, links, logos) to non-standard 
                  metric services"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal <strong>does not</strong> display references to non standard services"
        non_compliant: "<span class='answer'>Non-compliant</span>, this journal <strong>does</strong> display references to non standard services"
        later: "I don't know - mark for later"
      edit:
        publisher: "Publisher"
        title: "Journal's title"
      remember: ""
      instructions: ""
      resources:
        - label: "Quality Review Tool for Triage only"
          url: "https://docs.google.com/spreadsheets/d/1IA_glTNaVbVq2EwFV7vJBZBUVn31GQJk-DvU-PJlRWA/edit?usp=sharing"
      action: # not used here, should be removed
        button: "non_compliant"
        instruction: "Provide more information on non-standard metric services this journal references"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Provide more information on non-standard metric services this journal references"
      compliant_answers:
      - "compliant"
      non_compliant_answers:
      - "non_compliant"
      severity_value:
        non_compliant: 1

    ethics_no_fake_impact:
      label: "4. Fake impact factor values"
      check: "4. The journal <strong>does not</strong> display fake impact factor values in texts or/and images"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal <strong>does not</strong> display fake impact factor values"
        non_compliant: "<span class='answer'>Non-compliant</span>, this journal <strong>does</strong> fake impact factor values"
        later: "I don't know - mark for later"
      action:
        button: "non_compliant"
        instruction: "Instruction placeholder"
      edit:
        publisher: "Publisher"
        title: "Journal's title"
      remember: ""
      instructions: ""
      resources:
        - label: "Quality Review Tool for Triage only"
          url: "https://docs.google.com/spreadsheets/d/1IA_glTNaVbVq2EwFV7vJBZBUVn31GQJk-DvU-PJlRWA/edit?usp=sharing"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Instruction placeholder"
      compliant_answers:
      - "compliant"
      non_compliant_answers:
      - "non_compliant"
      severity_value:
        non_compliant: 3

    ethics_no_false_doaj_claim:
      label: "5. False claim to be indexed in DOAJ"
      check: "5. This journal <strong>does not</strong> make a false claim to be indexed in DOAJ"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal <strong>does not</strong> make a false claim to be indexed in DOAJ"
        non_compliant: "<span class='answer'>Non-compliant</span>, this journal <strong>does</strong> a false claim to be indexed in DOAJ"
        later: "I don't know - mark for later"
      action:
        button: "non_compliant"
        instruction: "Instruction placeholder"
      edit:
        title: "Journal's title"
      instructions: ""
      remember: ""
      resources:
        - label: "Quality Review Tool for Triage only"
          url: "https://docs.google.com/spreadsheets/d/1IA_glTNaVbVq2EwFV7vJBZBUVn31GQJk-DvU-PJlRWA/edit?usp=sharing"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Instruction placeholder"
      compliant_answers:
      - "compliant"
      non_compliant_answers:
      - "non_compliant"
      severity_value:
        non_compliant: 3

    ethics_submission_to_publication_time:
      label: "6. Time between submission and publication"
      check: "6. The time between submission and publication is more than 3 weeks"
      answers:
        compliant: "<span class='answer'>Compliant</span>, the time between submission and publication is <strong>more</strong> than 3 weeks."
        non_compliant: "<span class='answer'>Non-compliant</span>, the time between submission and publication is <strong>less</strong> than 3 weeks."
        later: "I don't know - mark for later"
      action:
        button: "non_compliant"
        instruction: "Instruction placeholder"
      info:
        label: "Average number of weeks between submission and publication"
      remember: ""
      instructions: ""
      compliant_answers:
        - "compliant"
      non_compliant_answers:
        - "non_compliant"
      severity_value:
        non_compliant: 3

    ethics_no_suspicious_ties:
      label: "7. Previous exclusions/suspicious publisher or journals"
      check: "7. The publisher/journal <strong>does not</strong> have links to previously excluded publishers and/or list of suspicious publishers"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this publisher/journal <strong>does not</strong> have any such links"
        non_compliant: "<span class='answer'>Non-compliant</span>, this publisher/journal <strong>does</strong> have such links"
        action: "No longer questionable"
        later: "I don't know - mark for later"
      action:
        non_compliant:
          instruction: "Add more details about suspicious or excluded publishers/journals"
        action:
          instruction: "Provide more details on why this publisher or journal are no longer questionable"
      remember: "If the entry in the spreadsheet is marked that is no longer questionable after last review, click <span class='answer action'>No longer questionable</span> and add a note"
      instructions: ""
      resources:
        - label: "Excluded publishers spreadsheet"
          url: "https://docs.google.com/spreadsheets/d/17Ai-JMAabCrVIR3uhhtFXQZKLAwrK7jKd9DBnU7-GH8"
      edit:
        instruction: "Please provide more details"
        compliant: "Continue triage"
        publisher: "Publisher"
        title: "Journal's title"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Add more details about suspicious or excluded publishers/journals, or why this publisher or journal are no longer questionable (if applicable)"
      compliant_answers:
      - "compliant"
      action_answers:
      - "action"
      non_compliant_answers:
      - "non_compliant"
      severity_value:
        non_compliant: 10

    issn_at_least_one:
      label: "8. ISSN(s)"
      check: "8. This journal has <strong>at least one</strong> ISSN (International Standard Serial Number) that is registered, active and confirmed at portal.issn.org"
      answers:
        compliant: "Compliant, this journal has at least one ISSN"
        non_compliant: "Non-compliant, this record has no active or confirmed ISSNs"
        later: "I don't know - mark for later"
        action: "ISSN needs to be changed"
      action:
        non_compliant:  # not currently used, should be removed
          instruction: "Add more detail about this records ISSNs"
        action:
          instruction: 'Make changes to PISSN and/or EISSN in the relevant fields below. Add more information on what changes to ISSN you are making and why in the Notes field. <strong class="highlight warning">PISSN and EISSN must be different</strong>'
      remember: "Search <strong>both</strong> ISSNs (if available)"
      instructions: '<ul>
                  <li>If the journal has no active and confirmed ISSN (unregistered, provisional, unreported, ceased), the answer is <span class="answer non_compliant">Non-compliant</span></li>
                  <li>If any of the ISSNs is unregistered, provisional, unreported or listed as ceased, click <span class="answer action">Changes to ISSNs are required</span>, remove it, and add a note</li>
                  <li>If you cannot find the ISSN in the ISSN portal or the search result is a different journal, try to search the ISSN portal by the title or see if you can find the correct ISSN in the journal’s website. If this is the case, click <span class="answer action">Changes to ISSNs are required</span>, make the change, and add a note</li>
                  <li>If the application contains only one ISSN but there are two confirmed and active in the ISSN Portal, click <span class="answer action">Changes to ISSNs are required</span>, add the second ISSN, and add a note</li>
                  </ul>'
      resources:
        - label: "ISSN portal"
          url: "https://portal.issn.org/"
      info:
        eissn: "Electronic ISSN"
        pissn: "Print ISSN"
      edit:
        eissn: "Electronic ISSN"
        pissn: "Print ISSN"
      validation:
        group:
          fields_should_be_different: "The EISSN and PISSN must be different"
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        eissn:
          regex_not_match: "The ISSN is not of the valid form"
          fields_should_be_different: "The value of the EISSN must be different to the PISSN"
        pissn:
          regex_not_match: "The ISSN is not of the valid form"
          fields_should_be_different: "The value of the PISSN must be different to the EISSN"
        note:
          is_conditionally_required: "Add more detail about this record's ISSNs, or add more information on what changes to ISSN you are making and why (if applicable)"
      compliant_answers:
        - "compliant"
      action_answers:
        - "action"
      non_compliant_answers:
        - "non_compliant"

    issn_country_match:
      label: "9. Country match"
      check: "9. Country in the application matches the country at ISSN portal"
      answers:
        compliant: "<span class='answer'>Compliant</span>, the country in the application <strong>does</strong> match the title at issn.portal.org"
        non_compliant: "<span class='answer'>Non-compliant</span>, the country in the application <strong>does not</strong> match the title at issn.portal.org"
        later: "I don't know - mark for later"
        action: ""
      action: # not currently used, should be removed
        non_compliant:
          instruction: "Provide more information about the publisher's country"
      remember: ""
      instructions: ''
      resources:
        - label: "ISSN portal"
          url: "https://portal.issn.org/"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Provide more information about the publisher's country"
      info:
        pissn: "Print ISSN"
        eissn: "Electronic ISSN"
        country: "Country of publisher"
      compliant_answers:
        - "compliant"
      non_compliant_answers:
        - "non_compliant"

    issn_title_match:
      label: "10. Title match"
      check: "10. The journal's title and alternative title in the application form and on the website match what is shown at issn.org"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal’s title and alternative title in the application, on the website and at ISSN portal <strong>does</strong> match each other"
        non_compliant: "<span class='answer'>Non-compliant</span>, No, this journal’s title or the alternative title in the application or on the website <strong>does not</strong>  match the ISSN portal"
        later: "I don't know - mark for later"
        action: "Journal's title or alternative needs to be changed"
      action:
        non_compliant:
          instruction: "Provide more information about this journal's title"
        action:
          instruction: "Provide correct title and/or alternative title in the relevant input below. Add more information on the change (eg. why this change is required) in the notes input.<strong class=highlight warning>Titles must not contain an HTML script tag</span>"
      remember: "<ul><li>Check both title and alternative title</li><li>If you need to edit the title always use the <strong>Online</strong> ISSN record (if available).</li></ul>"
      instructions: '<ul>
                  <li>If the title on the website matches the key-title or title proper at portal.issn.org but not the title provided in the application form, click <span class="answer action">Journal’s title needs to be changed</span>, provide the correct title and add a note </li>
                  <li>It is OK if there are some <strong>minor discrepancies</strong> between the title on the website and the one at portal.issn.org (e.g. a change from singular to plural of words, minor punctuation changes etc.)</li>
                  <li>For applications with the title in <strong>more than one language</strong>, we prefer to use as title the Key-title in original characters and as Alternative title the title in another language</li>
                  <li>For titles in Roman alphabet, change the Title and Alternative title to Title Case</li>
                  <li><strong>A subtitle is separated by a colon and one space</strong> (e.g. “Picenum Seraphicum: Rivista di Studi Storici e Francescani”). This differs from portal.issn.org where a full stop is used for subtitles and titles of parts /sections (full stop is acceptable for titles of parts /sections, e.g. “The Lancet Regional Health. Americas”). Publishers have the habit to add the subtitle in the Alternative title field. <strong>Please make sure to edit it so that the subtitle is always accompanied by the title</strong> (e.g. Siyar Journal: Social Issues by Academic Researchers)</li>
                  <li>Make sure to remove the Alternative title if it’s a duplicate entry</li>
                  <li>Never use Medline-style abbreviations</li>
                  <li>Sometimes publishers add the English version of the title in the Alternative title field even if the journal does not have an English website and the English title is not available in the ISSN portal record. The entry in the Alternative title field has to be present in the ISSN portal record or in the website. If not, you may remove the original entry in the Alternative title field</li>
                  </ul>'
      resources:
        - label: "ISSN portal"
          url: "https://portal.issn.org/"
      info:
        pissn: "Print ISSN"
        eissn: "Electronic ISSN"
        title_label: "Title"
        alttitle_label: "Alternative title"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "Provide more information about this journal's title, and any information on the change you have made (if applicable)"
        title:
          disallowed_value: "Title must not contain an HTML script tag"
          is_required: "Title is required"
          # note: "Provide more information about what change in the title you are making and why"
      edit:
        title: "Title"
      compliant_answers:
        - "compliant"
      action_answers:
        - "action"
      non_compliant_answers:
        - "non_compliant"
      recommend:
        non_compliant: "reject"

    issn_continuation:
      label: "11. Continuation"
      check: "11. This application is <strong>not</strong> for a continuation of existing journal"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this application <strong>is not</strong> for a continuation"
        later: "I don't know - mark for later"
        action: "This application <strong>is</strong> for a continuation"
      info:
        pissn: "Print ISSN"
        eissn: "Electronic ISSN"
      action:
        action:
          instruction: "In the input below provide preceding journal's ISSNs, separated by comma"
      remember: "If the exclusion does not relate to all journals from a publisher, an application for another journal from that publisher should not be rejected at this stage"
      instructions: '<ul>
                  <li>If your search at ISSN portal returns <strong>3 or more journals</strong> then it is likely that the answer is <span class="answer compliant">Yes</span>.</li>
                  <li>Continuation status is often noted in the ISSN portal records of individual ISSNs so check for this as well, as <strong>a journal may be a continuation even if your search returns fewer than 3 journals</strong></li>
                  <li>Check for journal records/previous applications of the preceding journal in DOAJ. If the preceding journal is currently indexed in DOAJ, click <span class="answer action">This application is for a continuation</span> and add the ISSN(s) to the relevant field, <strong>do not add the continuation details to the preceding journal record</strong>.</li>
                  <li>If the <strong>preceding journal has a record in DOAJ, but is not currently indexed</strong>, make a note of it. If there are <strong>previous (rejected) applications from the preceding journal</strong>, make a note of them too</li>
                  <li>If the new ISSN(s) are not confirmed at portal.issn.org, inform the publisher via the Rejection message to submit a new application as soon as the ISSN is confirmed so that the continuation may be created</li>
                  </ul>'
      resources:
        - label: "ISSN portal"
          url: "https://portal.issn.org/"
        - label: "DOAJ admin journal search"
          url: "https://doaj.org/admin"
      edit:
        continues: "If the preceeding journal is indexed in DOAJ, enter the ISSN(s) here (comma separated list)"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "The note field is required if the application is for a continuation, and the preceding journal is not currently indexed in DOAJ"
        continues:
          regex_not_match: "ISSN(s) must be of the valid form, separated by commas"
      compliant_answers:
        - "compliant"
      non_compliant_answers:
        - ""
      notes_required_answers:
        - "action"  # <- in this case only when no continuation ISSN is provided

    database_withdrawn:
      label: "12. Journal withdrawn"
      check: "12. This journal has <strong>not</strong> been removed from DOAJ earlier and does <strong>not</strong> have an embargo (6 months or otherwise)"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal <strong>has not</strong> been removed and <strong>does not</strong> have an embargo"
        action: "<span class='answer'>Non-compliant</span>, this journal <strong>has</strong> either been removed or <strong>has</strong> the embargo."
        later: "I don't know - mark for later"
      info:
        pissn: "Print ISSN"
        eissn: "Electronic ISSN"
      action:
        action:
          instruction: "Do any of these exceptions apply?"
          answers:
            compliant: "<span class='answer'>Non-compliant</span>, This journal has either been <strong>removed</strong> or has an <strong>embargo</strong> but exceptions are noted"
            non_compliant: "<span class='answer'>Non-compliant</span>, This journal has either been <strong>removed</strong> or has an <strong>embargo</strong>, and <strong>no</strong> exceptions are noted"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "The note field is required when one or more exception options are selected"
        exceptions:
          disallowed_value: "You must select one of the valid options"
      edit:
        exceptions: "Exceptions"
      exceptions:
        ignore_embargo: "The journal was removed previously and has a note to ignore the 6 month embargo from the Mg. Editor"
        website_unavailable: "The journal was removed previously because the journal website was not available"
        journal_content: "The journal was removed previously for not enough content and the journal’s contents are now enough to be included in DOAJ"
        none: "No special exceptions noted"
      remember: '<ul>
                  <li>Search <strong>both</strong> ISSNs (if available) in the journals admin site</li>
                  <li>If there is a record in DOAJ that it is not currently indexed, click the <span class="answer action">There is a record in DOAJ that is not currently indexed</span> and make a note of it (removal date, reasons and record’s URL)</li>
                  </ul>'
      instructions: ''
      resources:
        - label: "DOAJ admin journal search"
          url: "https://doaj.org/admin"
      compliant_answers:
        - "compliant"
      non_compliant_answers:
        - "non_compliant"
      note_required_exceptions:
      - ignore_embargo
      - website_unavailable
      - journal_content

    database_embargo:
      label: "13. Previous application rejection"
      check: "13. This journal <strong>application</strong> does <strong>not</strong> 
      does <strong>not</strong> have an embargo (6 months or otherwise)"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal application <strong>does not</strong> have an active embargo"
        # non_compliant: ""
        later: "I don't know - mark for later"
        action: "This journal <strong>does have</strong> an active embargo from a previous rejection"
        # conditional_non_compliant: "<span class='answer'>Non-compliant</span>, This journal <strong>does have</strong> an active embargo from a previous rejection, and <strong>no exceptions are noted</strong>"
        # conditional_compliant: "<span class='answer'>Non-compliant</span>, This journal <strong>does have</strong> an active embargo from a previous rejection, but <strong>exceptions are noted</strong>"
      info:
        pissn: "Print ISSN"
        eissn: "Electronic ISSN"
      action:
        action:
          instruction: "Do any of these exceptions apply?"
        button: "non_compliant"
        instruction: "Instruction placeholder"
      edit:
        exceptions: "Exceptions"
      exceptions:
        issn_confirmed: "This journal was previously rejected due to ISSN not being confirmed and it is now."
        ignore_embargo: "The journal was removed previously and has a note to ignore the 6 month embargo from the Mg. Editor"
        website_unavailable: "The journal was removed previously because the journal website was not available"
        journal_content: "The journal was removed previously for not enough content and the journal’s contents are now enough to be included in DOAJ"
        none: "No special exceptions noted"
      remember: '<ul>
                  <li>Search both <strong>ISSNs</strong> (if available) in the applications admin site and the UR admin site</li>
                  <li>If there are multiple records, open the most recently updated to see why it was rejected and when.</li>
                  </ul>'
      instructions: ''
      resources:
        - label: "DOAJ admin applications search"
          url: "https://doaj.org/admin/applications"
        - label: "DOAJ admin update requests search"
          url: "https://doaj.org/admin/update_requests"
      validation:
        group:
          is_conditionally_required: false  # This means we won't display a group-level error if the note is missing
        note:
          is_conditionally_required: "The note field is required"
        exceptions:
          disallowed_value: "You must select one of the valid options"
      compliant_answers:
        - "compliant"
        - "conditional_compliant"
      non_compliant_answers:
        - "conditional_non_compliant"

    database_not_listed:
      label: "14. Not indexed in DOAJ"
      check: "14. This journal is not currently listed in DOAJ "
      answers:
        compliant: "<span class='answer'>Compliant</span>, this record <strong>is not</strong> listed in DOAJ"
        non_compliant: "<span class='answer'>Non-compliant</span>, this record <strong>is</strong> currently listed in DOAJ"
        later: "I don't know - mark for later"
        action: ""
      info:
        pissn: "Print ISSN"
        eissn: "Electronic ISSN"
      action:
        button: "non_compliant"
        instruction: "Instruction placeholder"
      remember: ""
      instructions: ''
      resources:
        - label: "DOAJ admin journals search"
          url: "https://doaj.org/admin"
      compliant_answers:
        - "compliant"
      non_compliant_answers:
        - "non_compliant"
      recommend:
        non_compliant: "reject"

    website_working:
      label: "16. Website"
      check: "16. This journal has a working website"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this journal <strong>does</strong> have a working website"
        non_compliant: "<span class='answer'>Non-compliant</span>, this journal <strong>does not</strong> have a working website"
        later: "I don't know - mark for later"
        action: ""
      info:
        www: "Journal's homepage"
      action:
        button: "non_compliant"
        instruction: "Instruction placeholder"
      remember: "If the website doesn’t work now remember to check it again later at least once, in case these are temporary issues."
      instructions: '<ul>
                  <li>Open the homepage URL and make sure it is working. If not, check it again later and if it is still not working, the answer is <span class="answer non_compliant">Non-compliant</span></li>
                  </ul>'
      resources:
        - label: "https://downforeveryoneorjustme.com/"
          url: "https://downforeveryoneorjustme.com/"
      compliant_answers:
        - "compliant"
      non_compliant_answers:
        - "non_compliant"
      recommend:
        non_compliant: "reject"

    database_not_duplicate:
      label: "15. Duplicate application"
      check: "15. This application is <strong>not</strong> a duplicate"
      answers:
        compliant: "<span class='answer'>Compliant</span>, this application <strong>is not</strong> a duplicate"
        non_compliant: "<span class='answer'>Non-compliant</span>, it is a duplicate and <strong>there is a newer application</strong>"
        later: "I don't know - mark for later"
        action: "This is <strong>the most recent duplicate</strong> application"
      info:
        pissn: "Print ISSN"
